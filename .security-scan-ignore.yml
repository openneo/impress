# Advisories bin/security-scan should stop reporting, because we've reviewed
# them and decided they can't affect DTI. (Ruby gem ignores live in
# .bundler-audit.yml instead, so plain `bundle-audit check` honors them too.)
#
# Keys are GHSA IDs (the last part of the advisory URL). Each needs a reason.
# When a reason stops being true, delete the entry so the advisory surfaces
# again. bin/security-scan reports entries that no longer match anything, so
# they can be pruned.

# JS advisories ignored no matter where the package appears in our tree.
yarn:
  GHSA-968p-4wvh-cqc8: >-
    @babel/runtime: ReDoS in the .replace() method of Babel's wrapRegExp helper,
    when the replacement string is attacker-controlled. Our bundle's only use
    of wrapRegExp is Chakra's parseGradient, which just calls .exec() on a
    constant regex.
  GHSA-wrjc-x8rr-h8h6: >-
    react-router 6.x: open redirect when attacker-supplied paths starting with
    a backslash reach <Link>/useNavigate. We only navigate to paths we build,
    which always start with a literal "/outfits/". Fixed only in v7 (major).
  GHSA-337j-9hxr-rhxg: >-
    react-router 6.x: constructor injection via deserializeErrors() during SSR
    hydration. Only affects Framework/Data mode with manual SSR. We use
    declarative <BrowserRouter> with no SSR. Fixed only in v7 (major).
  GHSA-48c2-rrv3-qjmp: >-
    yaml: stack overflow on deeply nested YAML. Pulled in via
    @emotion/babel-plugin -> babel-plugin-macros -> cosmiconfig, which only run
    inside a Babel build, reading our own config files. We bundle with esbuild
    and never run Babel, and it never sees user input.

# JS advisories ignored only while they're reachable solely through
