# Advisories bin/security-scan should stop reporting, because we've reviewed
# them and decided they can't affect DTI. (Ruby gem ignores live in
# .bundler-audit.yml instead, so plain `bundle-audit check` honors them too.)
#
# Keys are GHSA IDs (the last part of the advisory URL). Each needs a reason.
# When a reason stops being true, delete the entry so the advisory surfaces
# again. bin/security-scan reports entries that no longer match anything, so
# they can be pruned.

# JS advisories ignored no matter where the package appears in our tree.
yarn:
  GHSA-wrjc-x8rr-h8h6: >-
    react-router 6.x: open redirect when attacker-supplied paths starting with
    a backslash reach <Link>/useNavigate. We only navigate to paths we build,
    which always start with a literal "/outfits/". Fixed only in v7 (major).
  GHSA-337j-9hxr-rhxg: >-
    react-router 6.x: constructor injection via deserializeErrors() during SSR
    hydration. Only affects Framework/Data mode with manual SSR. We use
    declarative <BrowserRouter> with no SSR. Fixed only in v7 (major).

# JS advisories ignored only while they're reachable solely through
# devDependencies. If one starts showing up in production dependencies, the
# scan reports it again.
#
# Our devDependencies are ESLint and friends (linting), Prettier, TypeScript
# (type-checking only), esbuild, husky, and express/oauth2-mock-server (used
# only by bin/neopass-server, a local NeoPass mock for development). None of
# them run in production or ship to browsers.
yarn_development:
  # @typescript-eslint's minimatch
  GHSA-g3hv-75wg-m249: "minimatch: globparts DoS. Dev-only (typescript-eslint)."

# Security news posts (by URL) we've already reviewed, so they stop being
# reported while they're still inside the scan's lookback window.
feeds:
  "https://discuss.rubyonrails.org/t/rails-security-releases-8-0-5-2-and-8-1-4-1/91802": >-
    We're on Rails 8.1.4.1 already.
  "https://discuss.rubyonrails.org/t/ghsa-744p-w4gc-m3gh-sql-injection-through-trilogy-escape-with-multibyte-encodings/91797": >-
    Trilogy-only. We use the mysql2 adapter.
  "https://www.ruby-lang.org/en/news/2026/10/23/regexp-fixes-for-gitlab-cves/": >-
    Memory corruption when compiling attacker-supplied regexes (Regexp.new on
    user input). DTI never compiles regexes from user input. Fixed in Ruby
    3.4.12; worth taking on the next Ruby upgrade.
  "https://www.ruby-lang.org/en/news/2026/08/27/multiple-vulnerabilities-in-resolv/": >-
    resolv: memory exhaustion and validation bypass when resolving
    attacker-influenced hostnames. Async's scheduler does use Resolv, but we
    only ever fetch fixed hosts (Neopets, NeoPass, Lebron, Impress 2020), never
    user-supplied URLs. Fixed in Ruby 3.4.12.
