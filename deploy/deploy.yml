---
- name: Deploy impress from the current local version
  hosts: webserver
  become: yes
  become_user: impress
  vars:
    local_app_root: "{{ playbook_dir  }}/.."
    remote_project_root: "/srv/impress"

    # deploy:setup should have added us to the "impress-deployers" group, so we
    # should be able to become the "impress" user without a password.
    ansible_become_password: ""

    # Set this to `yes` to skip setting this version as `current`. (We also
    # skip our usual cleanup, to avoid disrupting the `current` version!)
    #
    # This can be useful for upgrading our Ruby version without downtime:
    # 1. Update `ruby_version_latest` to the newest version, but not `ruby_version_live`.
    # 2. Run `deploy:setup` to install the latest Ruby version.
    # 3. Update the app to reference the new Ruby version in the `Gemfile`.
    # 4. Update `ruby_version_live` to the newest version, too.
    # 5. Deploy the app with `skip_set_as_current`.
    # 6. Update the service file manually to reference the newly-uploaded version by path.
    # 7. Link the new version as `current` manually.
    # 8. Reset the service file to use the new Ruby to run `current`.
    skip_set_as_current: no

    # Set this to `yes` to skip running database migrations, e.g. with
    # `bin/deploy -e skip_migrations=yes`. (Deploys also skip them on their own
    # when a pending migration is marked to be run by hand.) See
    # docs/database-migrations.md.
    skip_migrations: no
  tasks:
    - name: Generate a version name from the current timestamp
      command: date '+%Y-%m-%d-%s'
      register: new_app_version

    - name: Print out the new version name
      debug:
        msg: "Deploying new version: {{ new_app_version.stdout }}"

    - name: Save new remote folder path to a variable
      set_fact:
        remote_app_root: "{{ remote_project_root }}/versions/{{ new_app_version.stdout }}"

    - name: Create new remote folder for the new version
      file:
        path: "{{ remote_app_root }}"
        state: directory

    # NOTE: We skip most gitignored files, except for public/assets/*, which
    # contains the assets we precompiled for production. We also skip
    # vendor/bundle, where CI keeps its installed gems: the server installs its
    # own, into the shared bundle folder.
    - name: Copy local app's source files to new remote folder
      ansible.posix.synchronize:
        src: "{{ local_app_root }}/"
        dest: "{{ remote_app_root }}"
        # By default, synchronize skips checking the server's SSH host key!
        verify_host: true
        rsync_opts:
          - "--include=/public/assets/*"
          - "--exclude=.git"
          - "--exclude=/vendor/bundle"
          - "--filter=':- .gitignore'"

    - name: Link the public-data folder to the shared public-data folder
      file:
        src: "{{ remote_project_root }}/shared/public-data"
        dest: "{{ remote_app_root }}/public/public-data"
        state: link

    - name: Configure Bundler to run in deployment mode
      command:
        chdir: "{{ remote_app_root }}"
        cmd: /opt/ruby-{{ ruby_version_live }}/bin/bundle config set --local deployment true

    # This ensures that, while attempting our current deploy, we don't
    # accidentally delete gems out from under the currently-running version.
    # NOTE: From reading the docs, I thiink this is the default behavior, but
    # I can't be sure? Rather than deep-dive to find out, I'd rather just set
    # it, to be clear about the default(?) behavior we're depending on.
    - name: Configure Bundler to *not* clean up old gems when installing
      command:
        chdir: "{{ remote_app_root }}"
        cmd: /opt/ruby-{{ ruby_version_live }}/bin/bundle config set --local clean false

    # NOTE: Bundler recommends this, and they're pretty smart about it: if the
    # Gemfile changes, this shouldn't disrupt the currently-running version,
    # because we won't clean up its now-unused gems yet, and if we upgrade a
    # gem it'll install *both* versions of the gem until we clean up.
    - name: Configure Bundler to use the bundle folder shared by all app versions
      command:
        chdir: "{{ remote_app_root }}"
        cmd: "/opt/ruby-{{ ruby_version_live }}/bin/bundle config set --local path {{ remote_project_root}}/shared/bundle"

    - name: Run `bundle install` to install dependencies in remote folder
      command:
        chdir: "{{ remote_app_root }}"
        # The `--local` flag instructs Bundler to use the cached dependencies
        # in `vendor/cache`, instead of reading from the web, which is much
        # faster and more reliable!
        cmd: /opt/ruby-{{ ruby_version_live }}/bin/bundle install --local

    # We run migrations before switching to the new version, so the new code
    # never runs against an old schema. That means the *old* code runs against
    # the new schema for a bit, so migrations must be compatible with it (and
    # with Impress 2020, which shares the database). If a migration fails, the
    # deploy stops here, and the old version keeps running.
    # See docs/database-migrations.md.
    #
    # These commands load the app's environment the same way our cron jobs do:
    # from the .bash_profile that `deploy:setup` creates, which sets RAILS_ENV
    # and loads production.env.
    - name: Check pending migrations for ones that need running by hand
      shell:
        chdir: "{{ remote_app_root }}"
        executable: /bin/bash
        cmd: "source /srv/impress/.bash_profile && /opt/ruby-{{ ruby_version_live }}/bin/bundle exec rails deploy:check_migrations"
      register: migrations_check
      changed_when: false
      when: not (skip_migrations | bool)

    # (Rails also logs to stdout in production, so we pick out our lines.)
    - name: Read the results of the migrations check
      set_fact:
        manual_migrations: "{{ migrations_check.stdout_lines | select('match', '^MANUAL MIGRATION: ') | list }}"
        blocked_migrations: "{{ migrations_check.stdout_lines | select('match', '^BLOCKED MIGRATION: ') | list }}"
      when: not (skip_migrations | bool)

    # While a migration marked to run by hand is pending, deploys skip *all*
    # migrations, because they need to run in order. So an unmarked migration
    # would never run, and its code might depend on it: stop before switching.
    - name: Stop if unmarked migrations are waiting behind ones marked to run by hand
      fail:
        msg:
          - "These pending migrations can't run until the ones marked to run by hand do:"
          - "{{ blocked_migrations }}"
          - "Marked to run by hand:"
          - "{{ manual_migrations }}"
          - "Run the marked migrations on the server first (see docs/database-migrations.md),"
          - "then re-run this deploy. The current version is still running, unchanged."
      when: not (skip_migrations | bool) and blocked_migrations | length > 0

    - name: Run database migrations
      shell:
        chdir: "{{ remote_app_root }}"
        executable: /bin/bash
        cmd: "source /srv/impress/.bash_profile && /opt/ruby-{{ ruby_version_live }}/bin/bundle exec rails db:migrate"
      when: not (skip_migrations | bool) and manual_migrations | length == 0

    - name: Update the `current` folder to point to the new version
      file:
        src: "{{ remote_app_root }}"
        dest: /srv/impress/current
        state: link
      when: not skip_set_as_current

    # NOTE: This uses the passwordless sudo rule we set up in deploy:setup.
    # We write it as a command rather than using the built-in `systemd` Ansible
    # module, to make sure we're invoking it exactly as we wrote in that rule.
    #
    # NOTE: We use `sudo` instead of `become_user: root`, because we don't have
    # permission to *become* the root user; we only have permission to run this
    # one command as them.
    - name: Restart the app
      become: no
      command: sudo systemctl restart impress
      when: not skip_set_as_current

    - name: Clean up gems no longer used in the current app version
      command:
        chdir: "{{ remote_app_root }}"
        cmd: /opt/ruby-{{ ruby_version_live }}/bin/bundle clean
      when: not skip_set_as_current

    - name: Find older app versions to clean up
      # Print out all but the 5 last-recently-updated versions.
      command:
        chdir: "{{ remote_project_root }}/versions"
        cmd: bash -c 'ls -t | tail -n +6'
      register: versions_to_clean_up
      when: not skip_set_as_current

    - name: Clean up older versions
      file:
        path: "{{ remote_project_root }}/versions/{{ item }}"
        state: absent
      with_items: "{{ versions_to_clean_up.stdout_lines }}"
      when: not skip_set_as_current

    # The deploy itself succeeded, but we fail at the very end, so the run shows
    # up red and someone notices that migrations still need running by hand.
    - name: Fail, to flag migrations that still need running by hand
      fail:
        msg:
          - "Deployed, but SKIPPED MIGRATIONS: these pending migrations are marked to be run by hand:"
          - "{{ manual_migrations }}"
          - "When you're ready, run them on the server:"
          - "ssh impress.openneo.net, then: sudo -iu impress, then: cd /srv/impress/current && bin/rails db:migrate"
          - "Until then, deploys of changes with new migrations will stop before switching versions."
      when: not (skip_migrations | bool) and manual_migrations | length > 0
