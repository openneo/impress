development:
  primary:
    adapter: mysql2
    host: <%= ENV.fetch("DB_HOST", "localhost") %>
    database: openneo_impress
    username: root
    pool: 5
    encoding: utf8mb4
    collation: utf8mb4_unicode_520_ci
    variables:
      sql_mode: TRADITIONAL

  openneo_id:
    adapter: mysql2
    host: <%= ENV.fetch("DB_HOST", "localhost") %>
    database: openneo_id
    username: root
    pool: 2
    variables:
      sql_mode: TRADITIONAL
    migrations_paths: db/openneo_id_migrate

test:
  primary:
    adapter: mysql2
    host: <%= ENV.fetch("DB_HOST", "localhost") %>
    database: openneo_impress_test
    username: root
    pool: 5
    encoding: utf8mb4
    collation: utf8mb4_unicode_520_ci
    variables:
      sql_mode: TRADITIONAL

  openneo_id:
    adapter: mysql2
    host: <%= ENV.fetch("DB_HOST", "localhost") %>
    database: openneo_id_test
    username: root
    pool: 2
    variables:
      sql_mode: TRADITIONAL
    migrations_paths: db/openneo_id_migrate

production:
  primary:
    url: <%= ENV['DATABASE_URL_PRIMARY'] %>
    encoding: utf8mb4
    collation: utf8mb4_unicode_520_ci
    variables:
      sql_mode: TRADITIONAL

  openneo_id:
    url: <%= ENV['DATABASE_URL_OPENNEO_ID'] %>
    variables:
      sql_mode: TRADITIONAL
    migrations_paths: db/openneo_id_migrate
